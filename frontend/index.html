<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线导航演示</title>
  </head>
  <body>
    <main id="app">
      <section id="map" aria-label="导航地图"></section>
      <section id="controls">
        <p id="selection-status">点击地图选择起点</p>
        <label for="track-select">合成轨迹</label>
        <select id="track-select">
          <option value="current-route" selected>模拟当前路线</option>
          <option value="normal-route">回归测试：正常轨迹</option>
          <option value="off-route">回归测试：偏航轨迹</option>
        </select>
        <button id="plan-route" type="button" disabled>规划路线</button>
        <button id="start-replay" type="button" disabled>开始模拟回放</button>
        <p id="route-summary" aria-live="polite"></p>
        <section aria-label="语音导航">
          <button id="voice-record" type="button">开始录音</button>
          <label for="voice-text">目的地需求</label>
          <input id="voice-text" type="text" maxlength="500" placeholder="例如：导航去停车场" />
          <button id="voice-submit" type="button">解析需求</button>
          <p id="voice-status" aria-live="polite"></p>
          <p id="voice-intent"></p>
          <div id="voice-candidates"></div>
          <button id="voice-confirm" type="button" disabled>确认导航</button>
          <button id="voice-cancel" type="button">取消</button>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

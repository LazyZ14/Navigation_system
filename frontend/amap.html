<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>高德在线导航原型 - Amap Navigation Prototype</title>
  </head>
  <body>
    <main id="app">
      <!-- 高德地图挂载容器 -->
      <div id="amap-container"></div>

      <!-- 右上角导航链接 -->
      <nav id="top-nav">
        <button id="btn-config-key" class="nav-link" type="button">⚙️ Key 配置</button>
        <a href="/" class="nav-link">👈 返回离线导航 (MapLibre)</a>
      </nav>

      <!-- 左侧交互控制面板 -->
      <aside id="control-panel">
        <header class="panel-header">
          <h1 class="panel-title">
            <span>高德在线导航</span>
            <span class="badge-amap">Web JS API v2.0</span>
          </h1>
        </header>

        <!-- 地图与状态提示 -->
        <section class="section-box">
          <div class="section-title">运行状态</div>
          <div id="amap-status" class="status-text">正在加载高德地图 SDK...</div>
        </section>

        <!-- 自身定位模块 -->
        <section class="section-box">
          <div class="section-title">自身实时定位 (Geolocation)</div>
          <button id="btn-locate" class="btn btn-secondary" type="button">
            📍 获取当前浏览器实时定位
          </button>
          <div id="location-info" class="status-text coord-display">
            等待定位...
          </div>
        </section>

        <!-- 路线规划模块 -->
        <section class="section-box">
          <div class="section-title">高德路线规划 (Driving)</div>
          <div style="font-size: 12px; color: #64748b; margin-bottom: 6px;">
            提示：可以直接在地图上点击设置起点与终点。
          </div>
          <div id="points-status" class="status-text coord-display">
            起点: 未选择<br />终点: 未选择
          </div>
          <button id="btn-use-preset" class="btn btn-secondary" type="button">
            🎯 填充珠海测试点 (金鼎 -> 日月贝)
          </button>
          <button id="btn-plan-route" class="btn btn-primary" type="button" disabled>
            🚗 调用高德规划驾车路线
          </button>

          <!-- 路线规划结果 -->
          <div id="route-result-box" style="display: none;">
            <div class="route-summary">
              <div id="route-distance-time" class="summary-metric">-</div>
              <div id="route-extra-info" class="summary-desc">-</div>
            </div>
            <button id="btn-start-cruise" class="btn btn-success" type="button" style="margin-top: 8px;">
              ▶ 模拟小车沿路巡航
            </button>
            <div class="section-title" style="margin-top: 10px;">导航指引步骤</div>
            <ol id="route-steps" class="steps-list"></ol>
          </div>
        </section>
      </aside>

      <!-- Key 配置模态弹窗 -->
      <div id="key-modal" class="modal-overlay">
        <div class="modal-content">
          <h3 style="margin-top: 0; font-size: 16px;">高德 API Key 与安全密钥配置</h3>
          <p style="font-size: 12px; color: #64748b;">
            已默认预置你提供的 Web 端 Key 与安全密钥。如需更换，可在下方修改并保存。
          </p>
          <div class="form-group">
            <label class="form-label" for="input-amap-key">Web 端 (JS API) Key</label>
            <input id="input-amap-key" class="form-input" type="text" spellcheck="false" />
          </div>
          <div class="form-group">
            <label class="form-label" for="input-amap-security">安全密钥 (securityJsCode)</label>
            <input id="input-amap-security" class="form-input" type="text" spellcheck="false" />
          </div>
          <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;">
            <button id="btn-close-modal" class="btn btn-secondary" type="button" style="width: auto;">取消</button>
            <button id="btn-save-key" class="btn btn-primary" type="button" style="width: auto;">保存并刷新</button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/amap-main.ts"></script>
  </body>
</html>

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GPS_DEVICE_TOKENS_JSON: "${GPS_DEVICE_TOKENS_JSON:-{}}"
      GPS_MAX_ACTIVE_STREAMS: "${GPS_MAX_ACTIVE_STREAMS:-100}"
    ports:
      - "${GPS_LAN_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    restart: "no"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"
    restart: "no"

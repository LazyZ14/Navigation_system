services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/beijing.osrm
    volumes:
      - ./data/osrm:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    restart: "no"
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OSRM_BASE_URL: http://osrm:5000
    depends_on:
      - osrm
    ports:
      - "127.0.0.1:8000:8000"
    restart: "no"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"
    restart: "no"
